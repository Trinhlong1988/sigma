<!doctype html>
<!--
  Popup thông báo TỰ-VẼ (7/8, Admin Demo "exe không có push, Zalo tự vẽ popup") — THAY THẾ Windows Notification
  (máy anh ToastEnabled=0 chặn toast, và toast Windows đỏng đảnh). Cửa sổ frameless/transparent/always-on-top
  góc phải-dưới desktop. main.js đẩy dữ liệu qua IPC 'notif:data' (mảng tin xếp chồng), bấm 1 tin → 'notif:click'
  (main focus cửa sổ chính + điều hướng phòng). CHỈ 1 popup này (không kèm toast Windows) → không chồng đè.
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { background: transparent; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; gap: 8px; padding: 8px; align-items: flex-end; }
  .card {
    width: 336px; background: #ffffff; border-radius: 14px; padding: 12px 14px;
    box-shadow: 0 8px 28px rgba(15,23,42,0.28), 0 2px 6px rgba(15,23,42,0.12);
    border: 1px solid rgba(15,23,42,0.06); display: flex; gap: 11px; align-items: flex-start;
    cursor: pointer; transition: transform .12s ease, opacity .2s ease;
    animation: slidein .22s cubic-bezier(.2,.9,.3,1.2);
  }
  .card:hover { transform: translateY(-1px); }
  @keyframes slidein { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
  .avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; object-fit: cover;
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 15px; }
  .body { min-width: 0; flex: 1; }
  .title { font-size: 13.5px; font-weight: 700; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .text { font-size: 12.5px; color: #475569; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .close { flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; color: #94a3b8; font-size: 15px;
    display: flex; align-items: center; justify-content: center; line-height: 1; }
  .close:hover { background: #f1f5f9; color: #334155; }
  @media (prefers-color-scheme: dark) {
    .card { background: #1e293b; border-color: rgba(255,255,255,0.06); box-shadow: 0 8px 28px rgba(0,0,0,0.5); }
    .title { color: #f1f5f9; } .text { color: #cbd5e1; } .close:hover { background: #334155; }
  }
</style>
</head>
<body>
<div id="wrap"></div>
<script>
  const { ipcRenderer } = require('electron');
  const wrap = document.getElementById('wrap');

  // CHUÔNG (7/8, Admin Demo "mất âm thanh") — GỐC: popup tự vẽ THAY new Notification(silent:false) nên mất âm Windows.
  // Phát lại chuông Y HỆT web (playNotificationChime, audio-player.ts): 2 beep A5→E5 triangle, đi xuống. Web Audio,
  // KHÔNG cần file. Chỉ kêu khi có tin MỚI (số item tăng) — không kêu lúc re-render/tự ẩn.
  let _ac = null;
  function beep(freq, at, dur, gain, type) {
    const o = _ac.createOscillator(); const g = _ac.createGain();
    o.type = type; o.frequency.value = freq; o.connect(g); g.connect(_ac.destination);
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(gain, at + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.start(at); o.stop(at + dur + 0.02);
  }
  // 1 tin = 1 chuông (Admin Demo 8/8) — XẾP HÀNG chuông nối tiếp (chimeCursor) để nghe rõ từng tiếng khi dồn dập,
  // KHỚP audio-player.ts của web. Nhìn-trước tối đa 2.5s để burst lớn không kéo đuôi vô tận.
  let _chimeCursor = 0;
  function playChime() {
    try {
      if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
      if (_ac.state === 'suspended') _ac.resume();
      const start = Math.max(_ac.currentTime, _chimeCursor);
      if (start > _ac.currentTime + 2.5) return;
      beep(880, start, 0.22, 0.13, 'triangle');       // A5
      beep(659.25, start + 0.14, 0.28, 0.11, 'triangle'); // E5 — đi xuống, khớp web.
      _chimeCursor = start + 0.42;
    } catch (e) { /* best-effort — mất chuông không phá popup */ }
  }
  let lastChimeSeq = 0;
  function initials(name) { const p = (name||'?').trim().split(/\s+/); return (p.slice(0,2).map(x=>x[0]||'').join('')||'?').toUpperCase(); }
  function colorFor(key) { const c=['#2563eb','#0891b2','#059669','#d97706','#db2777','#7c3aed','#dc2626','#0d9488']; let h=0; for(const ch of String(key)) h=(h*31+ch.charCodeAt(0))|0; return c[Math.abs(h)%c.length]; }
  ipcRenderer.on('notif:data', (_e, data) => {
    // main gửi {items, chimeSeq}. chimeSeq tăng MỖI tin mới (theo notifSeq, KHÔNG theo số item bị cap) → kêu ĐÚNG
    // 1 chuông/tin kể cả khi burst >4 (item cũ bị đẩy ra). dismiss gửi chimeSeq cũ → KHÔNG kêu lại.
    const items = Array.isArray(data) ? data : (data && data.items) || [];
    const chimeSeq = Array.isArray(data) ? 0 : (data && data.chimeSeq) || 0;
    if (chimeSeq > lastChimeSeq && items.length > 0 && items[items.length - 1].playSound !== false) playChime();
    lastChimeSeq = Math.max(lastChimeSeq, chimeSeq);
    wrap.innerHTML = '';
    for (const it of items) {
      const card = document.createElement('div'); card.className = 'card';
      const av = document.createElement('div'); av.className = 'avatar';
      if (it.iconDataUrl) { const img = document.createElement('img'); img.src = it.iconDataUrl; img.className='avatar'; av.replaceWith(img); card.appendChild(img); }
      else { av.style.background = colorFor(it.roomId||it.title); av.textContent = initials(it.title); card.appendChild(av); }
      const b = document.createElement('div'); b.className = 'body';
      const t = document.createElement('div'); t.className = 'title'; t.textContent = it.title || 'SigMa';
      const x = document.createElement('div'); x.className = 'text'; x.textContent = it.body || '';
      b.appendChild(t); b.appendChild(x);
      const cl = document.createElement('div'); cl.className = 'close'; cl.textContent = '×';
      cl.addEventListener('click', (e) => { e.stopPropagation(); ipcRenderer.send('notif:dismiss', it.id); });
      card.addEventListener('click', () => ipcRenderer.send('notif:click', { roomId: it.roomId, id: it.id }));
      card.appendChild(b); card.appendChild(cl);
      wrap.appendChild(card);
    }
    // báo main chiều cao thật để resize + định vị đáy-phải.
    requestAnimationFrame(() => ipcRenderer.send('notif:height', Math.min(document.body.scrollHeight, 600)));
  });
</script>
</body>
</html>
